<title>Malanito Destructor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    position: fixed;
    inset: 0;
  }
  canvas#g {
    position: absolute;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    cursor: crosshair;
    display: block;
    touch-action: none;
  }
  #rotate {
    position: fixed;
    inset: 0;
    background: #06030f;
    color: #ffd23f;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: "Press Start 2P", monospace;
    font-size: 12px;
    text-align: center;
    z-index: 100;
    line-height: 2;
    padding: 20px;
    touch-action: none;
  }
  #rotate .ph { width: 34px; height: 60px; border: 3px solid #ff3fb0; border-radius: 6px; margin-bottom: 20px; animation: rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 70%, 100% { transform: rotate(90deg); } }
  @media (prefers-reduced-motion: reduce) { #rotate .ph { animation: none; transform: rotate(90deg); } }
</style>
</head>

// ============================================================
//  MALANITO DESTRUCTOR — motor base
//  Resolución interna 480x270 (16:9, horizontal), escalado pixelado
// ============================================================
'use strict';
const W = 480, H = 270;
const cv = document.getElementById('g');
const ctx = cv.getContext('2d');
const RS = 2; // escala de render: el lienzo interno es 960x540, la lógica sigue en 480x270
cv.width = W * RS; cv.height = H * RS;
ctx.imageSmoothingEnabled = false;

let SCALE = 1, OFFX = 0, OFFY = 0;
let lastWW = 0, lastWH = 0;

function fit() {
  const vv = window.visualViewport;
  let ww = window.innerWidth;
  let wh = window.innerHeight;
  if (vv && vv.width > 0 && vv.height > 0) {
    ww = Math.round(vv.width);
    wh = Math.round(vv.height);
  } else if (document.documentElement && document.documentElement.clientWidth > 0) {
    ww = document.documentElement.clientWidth;
    wh = document.documentElement.clientHeight;
  }
  if (!ww || !wh) {
    ww = window.innerWidth || 480;
    wh = window.innerHeight || 270;
  }
  SCALE = Math.min(ww / W, wh / H);
  if (SCALE <= 0 || !isFinite(SCALE)) SCALE = 1;
  const cw = Math.floor(W * SCALE), ch = Math.floor(H * SCALE);
  OFFX = Math.floor((ww - cw) / 2);
  OFFY = Math.floor((wh - ch) / 2);
  cv.style.width = cw + 'px';
  cv.style.height = ch + 'px';
  cv.style.left = OFFX + 'px';
  cv.style.top = OFFY + 'px';
  lastWW = ww; lastWH = wh;

  const rot = document.getElementById('rotate');
  if (rot) {
    rot.style.display = (wh > ww * 1.05) ? 'flex' : 'none';
  }
}

window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => { fit(); setTimeout(fit, 50); setTimeout(fit, 150); setTimeout(fit, 300); setTimeout(fit, 600); });
document.addEventListener('fullscreenchange', () => { fit(); setTimeout(fit, 100); setTimeout(fit, 300); });
document.addEventListener('webkitfullscreenchange', () => { fit(); setTimeout(fit, 100); setTimeout(fit, 300); });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fit);
  window.visualViewport.addEventListener('scroll', fit);
}
window.addEventListener('load', () => { fit(); setTimeout(fit, 100); setTimeout(fit, 300); });
document.addEventListener('DOMContentLoaded', () => { fit(); setTimeout(fit, 100); });
fit();

// ---------- utilidades ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function aabb(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
let frame = 0;

// ---------- guardado ----------
const Save = {
  data: { arena: false, best: 0, bestRank: '' },
  load() { try { const s = localStorage.getItem('malanito_save'); if (s) Object.assign(this.data, JSON.parse(s)); } catch (e) { } },
  write() { try { localStorage.setItem('malanito_save', JSON.stringify(this.data)); } catch (e) { } }
};
Save.load();

// ---------- recursos gráficos recortados del video ----------
const Assets = { sheet: new Image(), bg: new Image(), ok: false, bgOk: false };
Assets.sheet.onload = () => { Assets.ok = true; }; Assets.sheet.src = SHEET_SRC;
Assets.bg.onload = () => { Assets.bgOk = true; }; Assets.bg.src = BG_SRC;
// dibuja un sprite de la hoja: nombre, posición, alto en unidades de juego, anclaje ('feet' | 'center' | 'tl') y volteo horizontal
function spr(name, x, y, h, anchor, flip) {
  const r = ATLAS[name]; if (!r || !Assets.ok) return false;
  const sc = h / r[3], w = r[2] * sc;
  let dx = x, dy = y;
  if (anchor === undefined || anchor === 'feet') { dx = x - w / 2; dy = y - h; }
  else if (anchor === 'center') { dx = x - w / 2; dy = y - h / 2; }
  ctx.save();
  if (flip) { ctx.translate(dx + w, dy); ctx.scale(-1, 1); dx = 0; dy = 0; }
  ctx.drawImage(Assets.sheet, r[0], r[1], r[2], r[3], dx, dy, w, h);
  ctx.restore(); return true;
}
function sprW(name, h) { const r = ATLAS[name]; return r ? r[2] * h / r[3] : 0; }

// ---------- vibración ----------
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { } }

// ---------- efectos de pantalla ----------
const FX = { shake: 0, flash: 0, flashCol: '#fff', freeze: 0, negative: 0, glitch: 0, slow: 1, dark: 0 };
function shake(n) { FX.shake = Math.max(FX.shake, n); }
function flash(n, col) { FX.flash = n; FX.flashCol = col || '#fff'; }

// ---------- partículas ----------
const parts = [];
function spawnParts(x, y, n, col, spd, life, grav) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(0.3, spd);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(life * 0.5, life), t: 0, col: Array.isArray(col) ? pick(col) : col, g: grav || 0, sz: rnd(1, 3) });
  }
}
function updateParts() {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t++; p.x += p.vx; p.y += p.vy; p.vy += p.g;
    if (p.t > p.life) parts.splice(i, 1);
  }
}
function drawParts(camx) {
  for (const p of parts) { ctx.fillStyle = p.col; const s = p.sz * (1 - p.t / p.life) + 1; ctx.fillRect(Math.round(p.x - camx), Math.round(p.y), Math.ceil(s), Math.ceil(s)); }
}

// ---------- texto pixelado ----------
function txt(s, x, y, size, col, align, shadow) {
  ctx.font = `${size}px "Press Start 2P", monospace`;
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
  if (shadow !== false) { ctx.fillStyle = '#000'; ctx.fillText(s, x + 1, y + 1); }
  ctx.fillStyle = col || '#fff'; ctx.fillText(s, x, y);
}

// ============================================================
const Input = {
  l: false, r: false, d: false, u: false, jump: false, shoot: false, kick: false, burger: false, pause: false, any: false,
  pl: {}, // estado previo para detectar pulsaciones
  jumpP: false, kickP: false, burgerP: false, pauseP: false, anyP: false, upP: false,
  touches: {}, // id -> {x,y}
  keys: {},
  // botones virtuales (coordenadas internas)
  btn: {
    jump: { x: 432, y: 226, r: 25, col: '#3aa0ff', label: 'SALTO' },
    shoot: { x: 376, y: 238, r: 21, col: '#ff3fb0', label: 'PODER' },
    kick: { x: 428, y: 168, r: 19, col: '#ffcc33', label: 'PATADA' },
    burger: { x: 6, y: 40, w: 48, h: 22 },
    pause: { x: W - 32, y: 34, w: 24, h: 20 },
    dpad: { x: 62, y: 208, r: 46 }
  },
  update() {
    // reset ejes
    let l = false, r = false, d = false, u = false, jump = false, shoot = false, kick = false, burger = false, pause = false, any = false;
    const k = this.keys;
    if (k.ArrowLeft || k.KeyA) l = true;
    if (k.ArrowRight || k.KeyD) r = true;
    if (k.ArrowDown || k.KeyS) d = true;
    if (k.ArrowUp || k.KeyW) u = true;
    if (k.KeyX || k.KeyK || k.Space) jump = true;
    if (k.KeyZ || k.KeyJ) shoot = true;
    if (k.KeyC || k.KeyL || k.ShiftLeft) kick = true;
    if (k.KeyE || k.KeyQ) burger = true;
    if (k.KeyP || k.Escape) pause = true;
    if (k.Enter) any = true;
    for (const key in k) if (k[key]) any = true;
    const ids = Object.keys(this.touches);
    if (ids.length >= 3) pause = true;

// físicas y colisiones contra los sólidos del nivel
function movePlayer(p, lv) {
  const fr = lv.friction || 0.72;
  const acc = p.onGround ? (lv.slippery ? 0.35 : 0.9) : 0.55, max = 2.3;
  if (p.kick) return;
  let crouching = Input.d && p.onGround;
  if (!crouching) { const tb = { x: p.x - HERO.hw, y: p.y - HERO.h, w: HERO.hw * 2, h: HERO.h }; for (const s of lv.solids) if (s.ceiling && aabb(tb, s)) { crouching = true; break; } } // techo bajo: obliga a ir agachado
  p.st = crouching ? 'crouch' : (p.onGround ? (Math.abs(p.vx) > 0.4 ? 'run' : 'idle') : 'jump');
  if (!crouching) {
    if (Input.l) { p.vx -= acc; p.face = -1; }
    if (Input.r) { p.vx += acc; p.face = 1; }
    if (!Input.l && !Input.r) p.vx *= (p.onGround ? fr : 0.92);
  } else { p.vx *= (lv.slippery ? 0.94 : 0.8); if (Input.l) { p.face = -1; p.vx -= acc * 0.35; } if (Input.r) { p.face = 1; p.vx += acc * 0.35; } p.vx = clamp(p.vx, -1, 1); }

  // cinta transportadora
  if (p.onGround && p.conv) p.x += p.conv;
  // salto (y doble salto con zapatillas)
  if (Input.jumpP) {
    if (crouching && p.onThin) { p.dropThin = 12; p.onGround = false; } // bajar de plataformas delgadas
    else if (p.onGround) { p.vy = -7.6; p.jumps = 1; p.onGround = false; Audio.sJump(); }
    else if (p.items.shoes && p.jumps < 2) { p.vy = -6.8; p.jumps = 2; Audio.sJump(); spawnParts(p.x, p.y, 10, ['#37f0ff', '#fff'], 2, 18); }
  }
  if (!Input.jump && p.vy < -3) p.vy = -3; // salto variable
  p.vy = Math.min(p.vy + 0.42, 9);
  if (p.dropThin > 0) p.dropThin--;
  // --- X ---
  p.x += p.vx;
  let box = pBox(p);
  for (const s of lv.solids) {
    if (s.thin || s.off || s.grill || s.laser) continue;
    if (aabb(box, s)) { if (p.vx > 0) p.x = s.x - HERO.hw; else if (p.vx < 0) p.x = s.x + s.w + HERO.hw; p.vx = 0; box = pBox(p); }
  }
  if (p.x < (lv.minX || 0) + HERO.hw) { p.x = (lv.minX || 0) + HERO.hw; p.vx = Math.max(0, p.vx); }
  if (p.x > lv.w - HERO.hw) { p.x = lv.w - HERO.hw; p.vx = Math.min(0, p.vx); }
  // --- Y ---
  const prevBottom = p.y;
  p.y += p.vy; p.onGround = false; p.onThin = false; p.conv = 0;
  box = pBox(p);
  for (const s of lv.solids) {
    if (s.off || s.grill || s.laser) continue;
    if (!aabb(box, s)) continue;
    if (s.thin) { if (p.vy >= 0 && prevBottom <= s.y + 1 && p.dropThin === 0) { p.y = s.y; p.vy = 0; p.onGround = true; p.onThin = true; p.jumps = 0; } continue; }
    if (p.vy >= 0 && prevBottom <= s.y + 1) { p.y = s.y; p.vy = 0; p.onGround = true; p.jumps = 0; if (s.conv) p.conv = s.conv; }
    else if (p.vy < 0) { p.y = s.y + s.h + (p.st === 'crouch' ? HERO.ch : p.h); p.vy = 0.5; }
    else { p.y = s.y; p.onGround = true; p.vy = 0; }
    box = pBox(p);
  }
  // láseres y parrillas del nivel
  for (const s of lv.solids) {
    if (s.laser && s.on && aabb(box, s)) hurtPlayer(p, 2, p.face * -3);
    if (s.grill && s.on && p.onGround && p.x > s.x - 4 && p.x < s.x + s.w + 4 && Math.abs(p.y - s.y - 2) < 5) hurtPlayer(p, 1, p.face * -2);
  }
  // caída al vacío
  if (p.y > H + 30) { p.x = p.cpx; p.y = p.cpy; p.vx = 0; p.vy = 0; hurtPlayer(p, 2, 0); }
  if (p.onGround && p.y < H - 4) { p.cpx = p.x; p.cpy = p.y; }
  // animación
  p.animT += Math.abs(p.vx) > 0.4 ? 1 : 0; p.anim = Math.floor(p.animT / 6);
}

// disparos, súper disparo cargado, patada, hamburguesa
function playerActions(p, lv) {
  if (p.dead) return;
  if (p.fireCd > 0) p.fireCd--;
  if (p.inv > 0) p.inv--; if (p.hurtT > 0) p.hurtT--; if (p.fries > 0) p.fries--; if (p.eatT > 0) p.eatT--;
  if (Input.burgerP) eatBurger(p);
  if (p.kick) { updateKick(p, lv); return; }
  if (Input.kickP && p.meter >= 100) { startKick(p); return; }

  const CHARGE_TIME = 36; // ~0.6 segundos a 60fps para carga completa

  if (Input.shootP) {
    if (p.fireCd === 0) fireBasic(p, lv);
    p.charge = 1;
  }

  if (Input.shoot) {
    p.charge = (p.charge || 0) + 1;
    if (p.st !== 'crouch' && p.st !== 'jump') p.st = p.charge >= 10 ? 'charge' : 'shoot';
    if (p.st === 'jump') p.st = p.charge >= 10 ? 'charge' : 'shoot';

    if (p.charge < CHARGE_TIME) {
      if (p.charge % 8 === 0) Audio.sCharge(p.charge / CHARGE_TIME);
      if (p.charge > 10 && frame % 4 === 0) {
        spawnParts(p.x + p.face * 12, p.y - (p.st === 'crouch' ? HERO.cchest : HERO.chest), 1, '#ff3fb0', 1, 8);
      }
    } else if (p.charge === CHARGE_TIME) {
      Audio.sCharge(1.4);
      buzz(50);
      spawnParts(p.x + p.face * 14, p.y - (p.st === 'crouch' ? HERO.cchest : HERO.chest), 12, ['#ff3fb0', '#fff', '#37f0ff', '#ffe680'], 2.5, 20);
    } else {
      if (frame % 3 === 0) {
        spawnParts(p.x + p.face * 14 + rnd(-3, 3), p.y - (p.st === 'crouch' ? HERO.cchest : HERO.chest) + rnd(-3, 3), 2, ['#ff3fb0', '#fff', '#37f0ff'], 1.8, 12);
      }
    }
  } else {
    if (p.charge >= CHARGE_TIME) {

    }
    p.charge = 0;
  }
}

const ITEM_NAMES = { burger: 'HAMBURGUESA', fries: 'PAPAS PICANTES', visor: 'VISOR TÁCTICO', glove: 'GUANTELETE', shoes: 'ZAPATILLAS NEÓN', gold: 'HAMBURGUESA DORADA', neon: 'HAMBURGUESA DE NEÓN' };
function updatePickups(lv, p) {
  for (let i = lv.pickups.length - 1; i >= 0; i--) {
    const it = lv.pickups[i]; if (it.type === 'burnt') continue; it.t = (it.t || 0) + 1;
    if (it.vy !== undefined) { it.y += it.vy; it.vy += 0.3; for (const s of lv.solids) { if (!s.off && !s.laser && it.x > s.x && it.x < s.x + s.w && it.y > s.y && it.y < s.y + 10 && it.vy > 0) { it.y = s.y; it.vy = 0; } } }

  else { p.items[type] = true; Audio.sPickup(); FX.freeze = 10; }
  lv.msg = { text: ITEM_NAMES[type] || type, t: 110 }; buzz(40);
  spawnParts(p.x, p.y - 20, 20, ['#fff', '#ffd23f', '#31ff8a'], 2.5, 30);
}
function drawPickups(lv) {

// hazards que se encienden/apagan
function updateHazards(lv) {
  lv.hazT++;
  for (const s of lv.solids) {
    if (s.hazard === false) { s.on = false; continue; }
    if (s.grill) s.on = ((lv.hazT + s.phase) % 180) < 80;
    if (s.laser) s.on = ((lv.hazT + s.phase) % 200) < 110;
  }
}

class Boss {

  hitTest(bb) { return aabb(bb, this.box()); }
  damage(n, lv, p) { if (this.dead) return; this.hp -= n; this.hurt = 6; Audio.sHit(); if (this.hp <= 0) { this.hp = 0; this.die(lv, p); } }
  takeHit(b, lv, p) { this.damage(b.dmg, lv, p); spawnParts(b.x, b.y, 6, ['#fff', '#ff3fb0'], 2, 12); return 'hit'; }
  takeKick(lv, p) { this.damage(Math.ceil(this.maxHp / 3), lv, p); spawnParts(this.x, this.y - this.h / 2, 40, ['#ffd23f', '#fff'], 5, 40); }

const RANKS = [[2000, 'NOVATO DEL ARCADE'], [6000, 'CADETE GLITCH'], [15000, 'CAZADOR DE DRONES'], [30000, 'ROMPE-NÚCLEOS'], [60000, 'LEYENDA DEL COLISEO'], [Infinity, 'DIOS DEL CACAO DIGITAL']];
function rankFor(s) { for (const r of RANKS) if (s < r[0]) return r[1]; return RANKS[RANKS.length - 1][1]; }
function updateArena(lv, p) {
  const a = lv.arena;

  if (a.rain > 0) { a.rain--; if (a.rain % 6 === 0) lv.coins.push({ x: rnd(60, W - 60), y: -6, vx: 0, vy: rnd(1, 2), t: 0, life: 400, ground: false }); }
  const alive = lv.enemies.filter(e => !e.dead).length;

}

  if (a.wave % 15 === 0) { a.bossWave = true; const B = [BossMicroondas, BossZepelin, BossNucleo][(a.wave / 15 - 1) % 3]; lv.boss = new B(W / 2 + 100); lv.boss.hp = Math.ceil(lv.boss.maxHp * 0.6); lv.boss.maxHp = lv.boss.hp; lv.boss.name = 'HOLOGRAMA: ' + lv.boss.name; lv.spd = 2; Audio.sAlarm(); lv.msg = { text: 'RULETA DE JEFES', t: 100 }; return; }
  lv.msg = { text: 'OLEADA ' + a.wave, t: 80 }; Audio.sAlarm();
  const n = 3 + Math.floor(a.wave * 0.8); const pool = a.wave < 4 ? ['taza', 'espatula'] : a.wave < 8 ? ['taza', 'espatula', 'dron'] : a.wave < 14 ? ['taza', 'espatula', 'dron', 'pinball'] : ['taza', 'espatula', 'dron', 'pinball', 'centinela'];
  for (let i = 0; i < n; i++) { const type = pick(pool), d = ENEMY[type]; const x = d.fly ? rnd(40, W - 40) : pick([60, 120, 360, 420, 240]); const y = d.fly ? rnd(90, 160) : 230; const e = spawnEnemy(lv, type, x, y, { spawnT: 20 + i * 18 }); a.spawned++; if (a.spawned % 5 === 0) e.gold = true; if (type === 'taza') { e.dir = x < W / 2 ? -1 : 1; e.vx = -0.9; e.upd0 = true; } }
}
function drawArenaBG(lv) { // vacío digital alrededor de la plataforma
  ctx.globalAlpha = .5; R(0, 230, 40, 40, '#000'); R(440, 230, 40, 40, '#000'); ctx.globalAlpha = 1; for (let i = 0; i < 10; i++) { R((i * 47 + frame) % 40, 235 + (i * 13 + frame * 2) % 35, 2, 2, '#a34dff'); R(440 + (i * 47 + frame) % 40, 235 + (i * 13 + frame * 2) % 35, 2, 2, '#a34dff'); } }
function drawArenaHUD(lv, p) { const a = lv.arena; txt('OLEADA ' + a.wave, W / 2, 8, 7, '#37f0ff', 'center'); if (p.mult > 1) txt('x' + p.mult, W / 2, 18, 7, '#ffd23f', 'center'); if (p.hp <= 1 && p.burgers === 0) { ctx.globalAlpha = .3 + .2 * Math.sin(frame * .3); R(0, 0, W, 3, '#ff2b5c'); R(0, H - 3, W, 3, '#ff2b5c'); ctx.globalAlpha = 1; } }
function arenaOver() { const p = GAME.p; GAME.rank = rankFor(p.score); if (p.score > Save.data.best) { Save.data.best = p.score; Save.data.bestRank = GAME.rank; GAME.newBest = true; } else GAME.newBest = false; Save.write(); setScene('arenaover'); }

function sceneGameOver() {

  txt('GAME OVER', W / 2, 80, 20, '#ff2b5c', 'center'); txt('ETAPA ' + (GAME.levelIdx + 1) + ' · ' + LEVEL_NAMES[GAME.levelIdx], W / 2, 112, 6, '#aaa', 'center');
  const opts = ['CONTINUAR (MISMA ETAPA)', 'VOLVER AL TÍTULO']; const tp = Input.tap; Input.tap = null;

  for (let i = 0; i < 8; i++) { const yy = 84 - ((t * 0.7 + i * 12) % 70); ctx.globalAlpha = f * (yy / 84) * .7; R(410 + Math.sin(t * .05 + i) * 6 + i * 2, yy, 6 + i, 6 + i, '#777'); }

// ============================================================
//  BUCLE PRINCIPAL
// ============================================================
let last = 0, acc = 0;
function tick(now) {
  requestAnimationFrame(tick);
  // Detección en tiempo real de cambios de pantalla/orientación
  const vv = window.visualViewport;
  const curW = (vv && vv.width > 0) ? Math.round(vv.width) : (window.innerWidth || 0);
  const curH = (vv && vv.height > 0) ? Math.round(vv.height) : (window.innerHeight || 0);
  if (curW > 0 && curH > 0 && (curW !== lastWW || curH !== lastWH)) {
    fit();
  }
  if (!last) last = now; let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1;
  acc += dt * 60 * FX.slow;
  let steps = 0;
  while (acc >= 1 && steps < 4) { acc -= 1; steps++; step(); }
  render();
}
function step() {
  frame++; Input.update(); Audio.update();
  if (FX.shake > 0) FX.shake = Math.max(0, FX.shake - 0.8); if (FX.flash > 0) FX.flash--; if (FX.glitch > 0) FX.glitch--; if (FX.negative > 0) FX.negative--;
  if (FX.freeze > 0) { FX.freeze--; return; }
  GAME.t++;
  switch (GAME.scene) {
    case 'boot': if (GAME.t > 2) { GAME.introPhase = 0; setScene('intro'); } break;
    case 'play': updatePlay(); break;
    default: break;
  }
}
function render() {
  ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.imageSmoothingEnabled = false;
  switch (GAME.scene) {
    case 'boot': R(0, 0, W, H, '#000'); break;
    case 'intro': sceneIntro(); break;
    case 'title': sceneTitle(); break;
    case 'portal': scenePortal(); break;
    case 'play': drawPlay(); break;
    case 'shop': sceneShop(); break;
    case 'gameover': sceneGameOver(); break;
    case 'ending': sceneEnding(); break;
    case 'arenaover': sceneArenaOver(); break;
  }
  if (FX.negative > 0) { ctx.globalCompositeOperation = 'difference'; R(0, 0, W, H, '#fff'); ctx.globalCompositeOperation = 'source-over'; }
  if (FX.flash > 0) { ctx.globalAlpha = Math.min(0.8, FX.flash / 12); R(0, 0, W, H, FX.flashCol); ctx.globalAlpha = 1; }
  if (FX.glitch > 0) { for (let i = 0; i < 6; i++) { const y = rint(0, H - 8), h = rint(2, 8), dx = rint(-14, 14); ctx.drawImage(cv, 0, y * RS, W * RS, h * RS, dx, y, W, h); } ctx.globalAlpha = .15; R(0, 0, W, H, pick(['#ff3fb0', '#37f0ff'])); ctx.globalAlpha = 1; }
  // líneas de escaneo CRT sutiles
  ctx.globalAlpha = .08; for (let y = 0; y < H; y += 2) R(0, y, W, 1, '#000'); ctx.globalAlpha = 1;
  // pausa: las escenas que no son 'play' siguen animando pero no avanzan lógica de nivel
  if (GAME.scene !== 'play' && GAME.scene !== 'boot') { Input.tap = null; }
}
